<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Volume Booster</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="card" id="card" data-level="normal">
      <header class="head">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor" />
          <path
            d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <h1 class="title">Volume Booster</h1>
      </header>

      <section id="controls" class="controls">
        <div class="readout" aria-hidden="true">
          <span id="value">100</span><span class="unit">%</span>
        </div>
        <p id="db" class="db" aria-hidden="true">0.0 dB</p>

        <div class="slider-wrap">
          <input
            id="slider"
            type="range"
            min="0"
            max="500"
            step="1"
            value="100"
            aria-label="Volume"
          />
          <div class="ticks" role="group" aria-label="Presets">
            <button type="button" class="tick" data-percent="0" style="--at: 0%">0</button>
            <button
              type="button"
              class="tick"
              data-percent="100"
              style="--at: 20%"
              title="Reset to original volume"
            >
              100
            </button>
            <button type="button" class="tick" data-percent="200" style="--at: 40%">200</button>
            <button type="button" class="tick" data-percent="300" style="--at: 60%">300</button>
            <button type="button" class="tick" data-percent="400" style="--at: 80%">400</button>
            <button type="button" class="tick" data-percent="500" style="--at: 100%">500</button>
          </div>
        </div>
      </section>

      <section id="notice" class="notice" role="status" hidden>
        <p id="notice-text"></p>
        <button id="notice-action" type="button" class="primary" hidden></button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
